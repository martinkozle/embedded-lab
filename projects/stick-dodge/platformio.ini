; Stick Dodge: steer a ship with the joystick, dodge falling rocks, grab stars.
; Hardware: KY-023 joystick + SSD1306 OLED, wired as in hardware.md.

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = olikraus/U8g2 @ 2.36.18
