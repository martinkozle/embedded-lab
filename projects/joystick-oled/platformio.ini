; Hardware test for the KY-023 joystick and the 0.96" I2C OLED.
; Boots with an I2C scan, then shows the joystick on the screen and on Serial.

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = olikraus/U8g2 @ 2.36.18

; Same firmware for an SH1106 controller, in case the SSD1306 build shows
; garbage or a 2-pixel shifted image.
[env:esp32dev-sh1106]
extends = env:esp32dev
build_flags = -DOLED_SH1106
