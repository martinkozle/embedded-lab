; Stick Arcade: a menu of small joystick games on the OLED, with buzzer sounds.
; Hardware: KY-023 joystick, SSD1306 OLED and a passive buzzer, wired as in
; hardware.md.

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = olikraus/U8g2 @ 2.36.18
