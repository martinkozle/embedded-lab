; Blink "SOS" in Morse code on the on-board LED.

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
build_flags = -DLED_PIN=2

; Same firmware on the external LED (with resistor) wired to GPIO19.
[env:esp32dev-ext-led]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
build_flags = -DLED_PIN=19
