; Martin OS: a home station on the ESP32. First app: a wear counter for
; clothes, with a radial picker on the OLED.
; Hardware: KY-023 joystick, button A, SSD1306 OLED and a passive buzzer,
; wired as in hardware.md (same wiring as stick-arcade).

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = olikraus/U8g2 @ 2.36.18
